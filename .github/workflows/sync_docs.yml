name: Sync Docs to NotebookLM

on:
  push:
    branches:
      - main
    paths:
      - '**/*.md'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Synchronization Engine
        run: |
          pip install notebooklm-mcp-cli

      - name: Execute Sync Pipeline
        env:
          NOTEBOOK_ID: ${{ secrets.NOTEBOOK_ID }}
          NOTEBOOKLM_COOKIES: ${{ secrets.NOTEBOOKLM_COOKIES }}
          NOTEBOOKLM_METADATA: ${{ secrets.NOTEBOOKLM_METADATA }}
        run: |
          # The CLI doesn't have a native 'sync' subcommand for directories.
          # We use a bash loop to find and upload all Markdown files directly.
          find . -name "*.md" -type f | while read -r file; do
            echo "Uploading $file to Gemini Notebook..."
            nlm source add "$NOTEBOOK_ID" --file "$file"
          done
