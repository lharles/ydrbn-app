<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Y.D.R.B.N. — Reset &amp; Recovery Utility</title>
  <style>
    :root {
      --bg: #12100e;
      --card: #1c1814;
      --well: #100e0c;
      --border: #4a3d31;
      --amber: #f59e0b;
      --amber-hover: #fbbf24;
      --amber-light: #fde047;
      --text: #f3ede4;
      --muted: #a39480;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100dvh;
      max-height: 100dvh;
      overflow: hidden;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      -webkit-tap-highlight-color: transparent;
    }
    .container {
      width: 100%;
      max-width: 450px;
      height: 100dvh;
      margin: 0 auto;
      padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 10px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    .title-block { min-width: 0; flex: 1; }
    h1 {
      margin: 0;
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      color: var(--amber-light);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
    }
    .subtitle {
      margin: 1px 0 0 0;
      font-size: 0.66rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.15;
    }
    .controls-bar {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }
    .txt-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 24px;
      padding: 0 6px;
      border-radius: 5px;
      background: var(--well);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.62rem;
      font-weight: 700;
      text-decoration: none;
    }
    .txt-pill:hover {
      color: var(--amber-light);
      border-color: var(--amber);
    }
    .controls-bar select {
      background: var(--well);
      color: var(--amber-light);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 3px 5px;
      font-family: inherit;
      font-size: 0.68rem;
      font-weight: 700;
      cursor: pointer;
      max-width: 118px;
    }
    .content-stack {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 7px;
      scrollbar-width: none;
    }
    .content-stack::-webkit-scrollbar { display: none; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 11px;
    }
    .card h2 {
      margin: 0 0 5px 0;
      font-size: 0.78rem;
      color: var(--amber-light);
      line-height: 1.25;
    }
    .action-row {
      flex-shrink: 0;
      display: grid;
      grid-template-columns: 1.2fr 1fr 1fr;
      gap: 6px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      height: 36px;
      padding: 0 8px;
      border-radius: 8px;
      font-size: 0.72rem;
      font-weight: 800;
      text-decoration: none;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border: 1px solid var(--border);
      transition: transform 0.08s ease, background-color 0.15s ease, border-color 0.15s ease;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary {
      background: var(--amber);
      color: #12100e;
      border-color: #fbbf24;
    }
    .btn-primary:hover { background: var(--amber-hover); }
    .btn-secondary {
      background: var(--card);
      color: var(--amber-light);
    }
    .btn-secondary:hover {
      background: #27211b;
      border-color: var(--amber);
    }
    .card p {
      margin: 0 0 8px 0;
      font-size: 0.72rem;
      line-height: 1.38;
      color: #d6cbc0;
    }
    .btn-safe, .btn-wipe {
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.74rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.08s ease, filter 0.15s ease;
    }
    .btn-safe:active, .btn-wipe:active { transform: scale(0.98); }
    .btn-safe {
      background: var(--amber);
      color: #12100e;
      border: 1px solid #fbbf24;
    }
    .btn-safe:hover { filter: brightness(1.06); }
    .btn-wipe {
      background: #4c0519;
      color: #fecdd3;
      border: 1px solid #be123c;
    }
    .btn-wipe:hover { background: #881337; }
    #status {
      min-height: 16px;
      text-align: center;
      font-size: 0.7rem;
      font-weight: 700;
      color: #34d399;
    }
    .tips {
      background: var(--well);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 0.68rem;
      line-height: 1.4;
      color: var(--muted);
    }
    .tips strong { color: var(--text); }
  </style>
</head>

function renderLang(lang) {
  if (!DICT.it) DICT.it = IT_RESET;
  if (!DICT.ko) DICT.ko = KO_RESET;
  const d = DICT[lang] || DICT.en;
  const nav = NAV_LABELS[lang] || NAV_LABELS.en;
  document.getElementById('t-h1').textContent = d.h1;
  document.getElementById('t-sub').textContent = d.sub;
  document.getElementById('t-opt1-h2').textContent = d.opt1H2;
  document.getElementById('t-opt1-p').innerHTML = d.opt1P;
  document.getElementById('t-btn-safe').textContent = d.btnSafe;
  document.getElementById('t-opt2-h2').textContent = d.opt2H2;
  document.getElementById('t-opt2-p').innerHTML = d.opt2P;
  document.getElementById('t-btn-wipe').textContent = d.btnWipe;
  document.getElementById('t-tips').innerHTML = d.tips;
  document.getElementById('t-launch').textContent = nav.launch;
  document.getElementById('t-lnk-inst').textContent = nav.inst;
  document.getElementById('t-lnk-demo').textContent = nav.demo;
  document.getElementById('t-txt-link').href = lang === 'en' ? 'reset.txt' : 'reset_' + lang + '.txt';
  document.documentElement.lang = lang;
  document.documentElement.dir = (lang === 'ar' || lang === 'ur') ? 'rtl' : 'ltr';
}

function changeLang(lang) {
  localStorage.setItem('ydrbn_lang_static', lang);
  renderLang(lang);
}

async function clearWorkersAndCaches() {
  if ('caches' in window) {
    const names = await caches.keys();
    await Promise.all(names.map((n) => caches.delete(n)));
  }
  if ('serviceWorker' in navigator) {
    const regs = await navigator.serviceWorker.getRegistrations();
    await Promise.all(regs.map((r) => r.unregister()));
  }
}

async function runSafeUpdate() {
  const lang = document.getElementById('lang-select').value;
  const d = DICT[lang] || DICT.en;
  document.getElementById('status').textContent = d.msgSafe;
  try { await clearWorkersAndCaches(); } catch (e) {}
  setTimeout(() => { window.location.href = './?updated=' + Date.now(); }, 350);
}

async function runFactoryWipe() {
  const lang = document.getElementById('lang-select').value;
  const d = DICT[lang] || DICT.en;
  document.getElementById('status').textContent = d.msgWipe;
  try { localStorage.clear(); sessionStorage.clear(); } catch (e) {}
  try {
    if ('indexedDB' in window) {
      indexedDB.deleteDatabase('ydrbn_packs_db');
      if (indexedDB.databases) {
        const dbs = await indexedDB.databases();
        for (const db of dbs) {
          if (db.name) indexedDB.deleteDatabase(db.name);
        }
      }
    }
  } catch (e) {}
  try { await clearWorkersAndCaches(); } catch (e) {}
  setTimeout(() => { window.location.href = './?reset=' + Date.now(); }, 450);
}

(function init() {
  if (!DICT.it) DICT.it = IT_RESET;
  if (!DICT.ko) DICT.ko = KO_RESET;
  const urlLang = new URLSearchParams(window.location.search).get('lang');
  let prefLang = '';
  try {
    const stored = JSON.parse(localStorage.getItem('ydrbn_preferences') || '{}');
    if (stored.language && stored.language !== 'auto') prefLang = stored.language;
  } catch (e) {}
  const active = urlLang || prefLang || localStorage.getItem('ydrbn_lang_static') || (navigator.language || 'en').slice(0, 2);
  const chosen = DICT[active] ? active : 'en';
  document.getElementById('lang-select').value = chosen;
  renderLang(chosen);
})();
  </script>
