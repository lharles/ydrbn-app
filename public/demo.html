<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Y.D.R.B.N. — Video Walkthrough</title>
  <style>
    :root {
      --bg: #12100e;
      --card: #1c1814;
      --well: #100e0c;
      --border: #4a3d31;
      --amber: #f59e0b;
      --amber-hover: #fbbf24;
      --amber-light: #fde047;
      --text: #f3ede4;
      --muted: #a39480;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100dvh;
      max-height: 100dvh;
      overflow: hidden;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      -webkit-tap-highlight-color: transparent;
    }
    .container {
      width: 100%;
      max-width: 450px;
      height: 100dvh;
      margin: 0 auto;
      padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 10px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    .title-block {
      min-width: 0;
      flex: 1;
    }
    h1 {
      margin: 0;
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      color: var(--amber-light);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
    }
    .subtitle {
      margin: 1px 0 0 0;
      font-size: 0.66rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.15;
    }
    .controls-bar {
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }
    .controls-bar select {
      background: var(--well);
      color: var(--amber-light);
      border: 1px solid var(--amber);
      border-radius: 6px;
      padding: 4px 6px;
      font-family: inherit;
      font-size: 0.69rem;
      font-weight: 700;
      cursor: pointer;
      max-width: 138px;
    }
    .controls-bar select.cc-off {
      color: var(--muted);
      border-color: var(--border);
    }
    .video-wrap {
      flex: 1;
      min-height: 0;
      background: #000;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.8);
    }
    video {
      display: block;
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    video::cue {
      background-color: rgba(0, 0, 0, 0.55);
      color: #fde047;
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.3;
    }
    .action-row {
      flex-shrink: 0;
      display: grid;
      grid-template-columns: 1.2fr 1fr 1fr;
      gap: 6px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      height: 36px;
      padding: 0 8px;
      border-radius: 8px;
      font-size: 0.72rem;
      font-weight: 800;
      text-decoration: none;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border: 1px solid var(--border);
      transition: transform 0.08s ease, background-color 0.15s ease, border-color 0.15s ease;
    }
    .btn:active {
      transform: scale(0.97);
    }
    .btn-primary {
      background: var(--amber);
      color: #12100e;
      border-color: #fbbf24;
    }
    .btn-primary:hover {
      background: var(--amber-hover);
    }
    .btn-secondary {
      background: var(--card);
      color: var(--amber-light);
    }
    .btn-secondary:hover {
      background: #27211b;
      border-color: var(--amber);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="title-block">
        <h1 id="t-header">Y.D.R.B.N. WALKTHROUGH</h1>
        <p id="t-sub" class="subtitle">14-Step Guide • English Audio</p>
      </div>
      <div class="controls-bar">
        <select id="cc-select" class="cc-off" aria-label="Video Subtitles" title="Toggle Video Subtitles" onchange="changeSubtitles(this.value)">
          <option value="off" selected>💬 CC: OFF</option>
          <option value="en">CC: English (EN)</option>
          <option value="es">CC: Español (ES)</option>
          <option value="pt">CC: Português (PT)</option>
          <option value="fr">CC: Français (FR)</option>
          <option value="it">CC: Italiano (IT)</option>
          <option value="de">CC: Deutsch (DE)</option>
          <option value="id">CC: Indonesia (ID)</option>
          <option value="ja">CC: 日本語 (JA)</option>
          <option value="ko">CC: 한국어 (KO)</option>
          <option value="zh">CC: 中文 (ZH)</option>
          <option value="hi">CC: हिन्दी (HI)</option>
          <option value="bn">CC: বাংলা (BN)</option>
          <option value="ur">CC: اردو (UR)</option>
          <option value="ar">CC: العربية (AR)</option>
          <option value="ru">CC: Русский (RU)</option>
          <option value="tlh">CC: Klingon (TLH)</option>
          <option value="pig">CC: Pig-Latin (PIG)</option>
        </select>
      </div>
    </header>

    <div class="video-wrap">
      <video id="guide-video" controls playsinline crossorigin="anonymous">
        <source src="video/guide.mp4" type="video/mp4" />
      </video>
    </div>

    <div class="action-row">
      <a id="t-launch" href="./" class="btn btn-primary">⚡ Launch App</a>
      <a id="t-lnk-inst" href="install.html" class="btn btn-secondary">📲 Install</a>
      <a id="t-lnk-rst" href="reset.html" class="btn btn-secondary">🔧 Reset</a>
    </div>
  </div>

  <script>
    const DEMO_DICT = {
      ko: { h1: "Y.D.R.B.N. 기능 가이드", sub: "14단계 가이드 • 영어 오디오", launch: "⚡ 앱 실행", inst: "📲 설치 안내", rst: "🔧 복구·초기화" },
      en: { h1: "Y.D.R.B.N. WALKTHROUGH", sub: "14-Step Guide • English Audio", launch: "⚡ Launch App", inst: "📲 Install", rst: "🔧 Reset" },
      es: { h1: "DEMO Y.D.R.B.N.", sub: "Guía en 14 Pasos • Audio en Inglés", launch: "⚡ Abrir App", inst: "📲 Instalar", rst: "🔧 Reiniciar" },
      pt: { h1: "DEMO Y.D.R.B.N.", sub: "Guia em 14 Passos • Áudio em Inglês", launch: "⚡ Abrir App", inst: "📲 Instalar", rst: "🔧 Restaurar" },
      fr: { h1: "DÉMO Y.D.R.B.N.", sub: "Guide en 14 Étapes • Audio Anglais", launch: "⚡ Lancer", inst: "📲 Installer", rst: "🔧 Réinit." },
      it: { h1: "DEMO Y.D.R.B.N.", sub: "Guida in 14 Passi • Audio Inglese", launch: "⚡ Avvia App", inst: "📲 Installa", rst: "🔧 Ripristina" },
      de: { h1: "Y.D.R.B.N. DEMO", sub: "14-Schritte-Guide • Audio Englisch", launch: "⚡ Starten", inst: "📲 Install.", rst: "🔧 Reset" },
      id: { h1: "PANDUAN Y.D.R.B.N.", sub: "Panduan 14 Langkah • Audio Inggris", launch: "⚡ Buka App", inst: "📲 Pasang", rst: "🔧 Reset" },
      ja: { h1: "Y.D.R.B.N. 機能ガイド", sub: "14ステップ解説 • 英語音声", launch: "⚡ 起動する", inst: "📲 設置手順", rst: "🔧 復元・更新" },
      zh: { h1: "Y.D.R.B.N. 视频指南", sub: "14 步功能详解 • 英语原声", launch: "⚡ 启动应用", inst: "📲 安装指南", rst: "🔧 重置工具" },
      hi: { h1: "Y.D.R.B.N. वीडियो गाइड", sub: "14-चरणीय गाइड • अंग्रेज़ी ऑडियो", launch: "⚡ ऐप खोलें", inst: "📲 इंस्टॉल", rst: "🔧 रीसेट" },
      bn: { h1: "Y.D.R.B.N. ভিডিও গাইড", sub: "১৪-ধাপের গাইড • ইংরেজি অডিও", launch: "⚡ অ্যাপ খুলুন", inst: "📲 ইনস্টল", rst: "🔧 রিসেট" },
      ur: { h1: "Y.D.R.B.N. ویڈیو گائیڈ", sub: "14 مراحل کی گائیڈ • انگریزی آڈیو", launch: "⚡ ایپ کھولیں", inst: "📲 انسٹال", rst: "🔧 ری سیٹ" },
      ar: { h1: "دليل فيديو Y.D.R.B.N.", sub: "شرح في 14 خطوة • صوت إنجليزي", launch: "⚡ تشغيل", inst: "📲 تثبيت", rst: "🔧 ضبط" },
      ru: { h1: "ВИДЕООБЗОР Y.D.R.B.N.", sub: "14 шагов • Английская озвучка", launch: "⚡ Запуск", inst: "📲 Установка", rst: "🔧 Сброс" },
      tlh: { h1: "Y.D.R.B.N. HASTA PAQ", sub: "14-mIw ghuH • DIvI' Hol wab", launch: "⚡ chu'", inst: "📲 jom", rst: "🔧 Reset" },
      pig: { h1: "Y.D.R.B.N. ALKTHROUGHWAY", sub: "14-Epstay Uidegay • Englishway Audioway", launch: "⚡ Aunchlay", inst: "📲 Installway", rst: "🔧 Esetray" }
    };

    let baseLang = 'en';

    function renderLang(lang) {
      const d = DEMO_DICT[lang] || DEMO_DICT.en;
      document.getElementById('t-header').textContent = d.h1;
      document.getElementById('t-sub').textContent = d.sub;
      document.getElementById('t-launch').textContent = d.launch;
      document.getElementById('t-lnk-inst').textContent = d.inst;
      document.getElementById('t-lnk-rst').textContent = d.rst;
      document.documentElement.lang = lang;
      document.documentElement.dir = (lang === 'ar' || lang === 'ur') ? 'rtl' : 'ltr';
    }

    function changeSubtitles(ccLang) {
      const vid = document.getElementById('guide-video');
      const sel = document.getElementById('cc-select');
      const isOff = !ccLang || ccLang === 'off';
      if (sel) sel.className = isOff ? 'cc-off' : '';

      renderLang(isOff ? baseLang : ccLang);
      if (!vid) return;

      vid.querySelectorAll('track').forEach(t => t.remove());
      if (vid.textTracks) {
        for (let i = 0; i < vid.textTracks.length; i++) {
          vid.textTracks[i].mode = 'disabled';
        }
      }
      if (!isOff) {
        const trkEl = document.createElement('track');
        trkEl.kind = 'subtitles';
        trkEl.src = 'video/subtitles/guide_' + ccLang + '.vtt';
        trkEl.srclang = ccLang;
        trkEl.label = ccLang.toUpperCase();
        trkEl.default = true;
        vid.appendChild(trkEl);
        setTimeout(() => {
          if (vid.textTracks && vid.textTracks[0]) {
            vid.textTracks[0].mode = 'showing';
          }
        }, 60);
      }
    }

    (function init() {
      const urlLang = new URLSearchParams(window.location.search).get('lang');
      let prefLang = '';
      try {
        const stored = JSON.parse(localStorage.getItem('ydrbn_preferences') || '{}');
        if (stored.language && stored.language !== 'auto') prefLang = stored.language;
      } catch (e) {}
      const active = urlLang || prefLang || localStorage.getItem('ydrbn_lang_static') || (navigator.language || 'en').slice(0, 2);
      baseLang = DEMO_DICT[active] ? active : 'en';
      renderLang(baseLang);
      changeSubtitles('off');
    })();
  </script>
</body>
</html>
