<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Y.D.R.B.N. — Functionality Walkthrough Video</title>
  <meta name="description" content="Watch the walkthrough of Y.D.R.B.N. (Your Daily Random Band Name)." />
  <meta name="theme-color" content="#12100e" />
  <link rel="icon" type="image/svg+xml" href="/ydrbn-app/icon.svg" />
  <link rel="apple-touch-icon" href="/ydrbn-app/icon-192.png" />
  <style>
    :root {
      --bg: #12100e;
      --card: #1c1814;
      --border: #4a3d31;
      --amber: #f59e0b;
      --amber-light: #fde047;
      --text: #f3ede4;
      --muted: #a39480;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100dvh;
    }
    .container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    header {
      text-align: center;
      padding: 12px 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
    }
    h1 {
      margin: 0 0 2px 0;
      font-size: 1.1rem;
      letter-spacing: 0.08em;
      color: var(--amber-light);
    }
    .subtitle {
      font-size: 0.75rem;
      color: var(--muted);
      margin: 0;
    }
    .video-box {
      background: #000;
      border: 2px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.85);
      display: flex;
      justify-content: center;
    }
    video {
      width: 100%;
      max-height: 72dvh;
      display: block;
      object-fit: contain;
    }
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .btn {
      display: inline-block;
      text-align: center;
      text-decoration: none;
      padding: 11px 12px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.82rem;
      border: 1px solid var(--amber);
      background: rgba(245, 158, 11, 0.15);
      color: var(--amber-light);
    }
    .btn-primary {
      background: var(--amber);
      color: #12100e;
      border: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Y.D.R.B.N. // WALKTHROUGH</h1>
      <p class="subtitle">Your Daily Random Band Name &bull; Feature Tour</p>
    </header>

    <div class="video-box">
      <video src="/ydrbn-app/video/guide.mp4" controls autoplay playsinline preload="metadata"></video>
    </div>

    <div class="actions">
      <a href="/ydrbn-app/" class="btn btn-primary">Launch App &rarr;</a>
      <a href="/ydrbn-app/install.html" class="btn">Install Guide</a>
    </div>
  </div>
</body>
</html>
